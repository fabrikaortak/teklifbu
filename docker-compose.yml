services:
  db:
    image: postgres:16-alpine
    container_name: teklifbu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: teklifbu
      POSTGRES_PASSWORD: teklifbu_secret
      POSTGRES_DB: teklifbu
    ports:
      - "5433:5432"
    volumes:
      - teklifbu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teklifbu -d teklifbu"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: teklifbu-web
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      DATABASE_URL: postgresql://teklifbu:teklifbu_secret@db:5432/teklifbu?schema=public&connect_timeout=5
      AUTH_SECRET: ${AUTH_SECRET:-teklifbu-prod-change-me}
      NODE_ENV: production
      OTP_PROVIDER: ${OTP_PROVIDER:-dev}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-auto}
      SKIP_DB: "0"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://teklifbu.com.tr}
    volumes:
      - teklifbu_uploads:/app/public/uploads
      # Boot script host'tan — düzeltme için 20dk image rebuild gerekmez
      - ./scripts/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3010/api/theme >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  teklifbu_pgdata:
  teklifbu_uploads:
